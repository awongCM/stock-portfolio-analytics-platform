version: "3.8"

services:
  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: portfolio-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  # MinIO client to create buckets
  minio-setup:
    image: minio/mc:latest
    container_name: portfolio-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Configuring MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/iceberg-warehouse --ignore-existing;
      /usr/bin/mc mb myminio/stock-data --ignore-existing;
      /usr/bin/mc anonymous set download myminio/iceberg-warehouse;
      /usr/bin/mc anonymous set download myminio/stock-data;
      echo 'MinIO buckets configured successfully!';
      exit 0;
      "
    restart: on-failure

  # PySpark with AWS Glue libraries
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-spark
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master
      - "4040:4040" # Spark Application UI
      - "8888:8888" # Jupyter Lab
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark-apps
      - MINIO_ENDPOINT=http://minio:9000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=portfolio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./src:/opt/spark-apps/src
      - ./scripts:/opt/spark-apps/scripts
      - ./tests:/opt/spark-apps/tests
      - ./data:/opt/spark-apps/data
      - ./notebooks:/opt/spark-apps/notebooks
      - ./config:/opt/spark-apps/config
      - ./.env:/opt/spark-apps/.env
      - spark-warehouse:/opt/spark-warehouse
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: /opt/spark-apps/scripts/container-init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL with TimescaleDB for Supabase
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: portfolio-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  postgres-data:
  spark-warehouse:
