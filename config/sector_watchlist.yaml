# Curated APAC sector watchlist for multi-region POC
# 2-3 liquid counters per GICS sector × 4 markets (AU/NZ/MY/SG)
# Yahoo Finance suffix conventions: .AX .NZ .KL .SI

base_currency: AUD

regions:
  AU:
    name: Australia
    market_code: ASX
    country_code: AU
    quote_currency: AUD
    suffix: .AX
  NZ:
    name: New Zealand
    market_code: NZX
    country_code: NZ
    quote_currency: NZD
    suffix: .NZ
  MY:
    name: Malaysia
    market_code: BURSA
    country_code: MY
    quote_currency: MYR
    suffix: .KL
  SG:
    name: Singapore
    market_code: SGX
    country_code: SG
    quote_currency: SGD
    suffix: .SI

# Yahoo FX pairs for base-currency conversion (AUD reporting)
fx_pairs:
  - AUDUSD=X
  - AUDNZD=X
  - AUDMYR=X
  - AUDSGD=X
  - NZDUSD=X
  - USDMYR=X
  - USDSGD=X

