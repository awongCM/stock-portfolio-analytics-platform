[tool.poetry]
name = "stock-portfolio-analytics-platform"
version = "0.1.0"
description = "Stock portfolio analytics platform combining PostgreSQL, Apache Iceberg, and Spark for comprehensive performance evaluation"
authors = ["Andy Wong <awong.cm@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "^3.5.0"
supabase = "^2.3.4"
pyiceberg = "^0.6.0"
pandas = "^2.1.4"
numpy = "^1.26.3"
python-dotenv = "^1.0.0"
boto3 = "^1.34.23"
yfinance = "^0.2.55"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.1.0"
ruff = "^0.1.13"
mypy = "^1.8.0"
ipython = "^8.20.0"
jupyterlab = "^4.0.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
